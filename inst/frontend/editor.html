<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width" />
    <meta charset="utf-8" />

    <meta name="pluto-insertion-spot-meta">

    <meta name="theme-color" id="ember-theme-color" content="#fcfcfb">
    <meta name="color-scheme" content="light dark">

    <!-- Sets <html data-theme="light"|"dark"> and the theme-color meta
         before any stylesheet loads, so the first paint is already in the
         right theme (ui-3-plan.md, "Theme switching"). common/theme.js
         does the same on every later switch; kept in sync with
         get_settings()'s THEME reading. -->
    <script>
        (function () {
            var theme = "system";
            try {
                var raw = localStorage.getItem("pluto_setting_THEME");
                if (raw != null) theme = JSON.parse(raw);
            } catch (e) {}
            if (theme !== "light" && theme !== "dark") theme = "system";
            if (theme === "system") {
                theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
            var meta = document.getElementById("ember-theme-color");
            if (meta) meta.setAttribute("content", theme === "dark" ? "#1b201d" : "#fcfcfb");
        })();
    </script>

    <link rel="icon" type="image/svg+xml" href="./img/favicon.svg">
    <link rel="pluto-external-source" id="pluto-logo-big" href="./img/logo.svg" />
    <link rel="pluto-external-source" id="pluto-logo-small" href="./img/favicon.svg" />

    <script defer>
        console.log(
            "Ember, an R notebook. Its frontend is a fork of Pluto.jl by Fons van der Plas and the Pluto.jl authors (MIT)."
        )
    </script>

    <link rel="stylesheet" href="./all-styles.css" type="text/css" />

    <meta name="pluto-insertion-spot-parameters">
    <script src="./editor.js" type="module" defer></script>
    <script src="./warn_old_browsers.js"></script>

    <!-- Loaded by common/SetupMathJax.js the first time an output contains TeX. -->

</head>

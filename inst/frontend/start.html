<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width" />
    <meta charset="utf-8" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfcfb">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b201d">
    <meta name="color-scheme" content="light dark">

    <!-- Sets <html data-theme="light"|"dark"> before any stylesheet loads;
         see editor.html's copy of this script for why. -->
    <script>
        (function () {
            var theme = "system";
            try {
                var raw = localStorage.getItem("pluto_setting_THEME");
                if (raw != null) theme = JSON.parse(raw);
            } catch (e) {}
            if (theme !== "light" && theme !== "dark") theme = "system";
            if (theme === "system") {
                theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

    <link rel="icon" type="image/svg+xml" href="./img/favicon.svg">

    <title>ember</title>

    <link rel="stylesheet" href="./fonts.css" type="text/css" />
    <link rel="stylesheet" href="./themes/light.css" type="text/css" />
    <link rel="stylesheet" href="./themes/dark.css" type="text/css" />
    <link rel="stylesheet" href="./ember-forms.css" type="text/css" />
    <link rel="stylesheet" href="./start.css" type="text/css" />

    <script src="./start.js" type="module" defer></script>
</head>

<body>
    <div id="ember-start-root"></div>
</body>

</html>

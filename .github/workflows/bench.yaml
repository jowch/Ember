name: bench

# Times the pull request against its base branch on one runner and flags a
# case more than 20% slower (bench/README.md). Kept apart from check.yaml so
# it can stay out of the required checks.

on:
  pull_request:
    # Only changes that can change the timed code's speed; a docs- or
    # tests-only PR would spend about ten runner minutes to learn nothing.
    paths:
      - 'R/**'
      - 'inst/**'
      - 'src/**'
      - 'DESCRIPTION'
      - 'bench/**'
      - 'tests/testthat/helper-perf.R'
      - 'tests/testthat/helper-core.R'
  # By hand, any two refs: main against main is an A/A run, which shows how
  # far identical code reads apart on a runner (#179).
  workflow_dispatch:
    inputs:
      base:
        description: Base ref
        default: main
      head:
        description: Head ref (bench/ is always taken from it)
        default: main

# A new push to a pull request cancels that PR's older runs, which would only
# report on a head nobody will merge. Every other run (a push, a run by hand)
# gets a group of its own, so it is never cancelled and never waits: a shared
# group would also drop a run still waiting behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head || github.sha }}
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Install base and head into separate libraries
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          SAME: ${{ github.event_name == 'workflow_dispatch' && inputs.base == inputs.head }}
        run: |
          # The same ref on both sides is an A/A run, so the base is the
          # commit checked out as head: a branch that moves while the run
          # waits for a runner would otherwise put different commits on the
          # two sides. Otherwise a branch name by hand resolves on origin; a
          # sha (the PR's base) as is.
          if [ "$SAME" = true ]; then
            base=$(git rev-parse HEAD)
          else
            base=$(git rev-parse --verify -q "origin/$BASE^{commit}" || git rev-parse --verify -q "$BASE^{commit}")
          fi
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          mkdir -p "$RUNNER_TEMP/lib-base" "$RUNNER_TEMP/lib-head"
          R CMD INSTALL --library="$RUNNER_TEMP/lib-base" "$RUNNER_TEMP/base"
          R CMD INSTALL --library="$RUNNER_TEMP/lib-head" .
      - name: Compare head with base
        run: Rscript bench/compare.R "$RUNNER_TEMP/lib-base" "$RUNNER_TEMP/base" "$RUNNER_TEMP/lib-head" . 5

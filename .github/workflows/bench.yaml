name: bench

# Times the pull request against its base branch on one runner and flags a
# case more than 25% slower (bench/README.md). Kept apart from check.yaml so
# it can stay out of the required checks.

on:
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Install base and head into separate libraries
        run: |
          git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          mkdir -p "$RUNNER_TEMP/lib-base" "$RUNNER_TEMP/lib-head"
          R CMD INSTALL --library="$RUNNER_TEMP/lib-base" "$RUNNER_TEMP/base"
          R CMD INSTALL --library="$RUNNER_TEMP/lib-head" .
      - name: Compare head with base
        run: Rscript bench/compare.R "$RUNNER_TEMP/lib-base" "$RUNNER_TEMP/base" "$RUNNER_TEMP/lib-head" . 5

name: check

on:
  push:
    branches: [main, 'ci/**']
  pull_request:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    name: R CMD check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Only on ubuntu-latest: the opt-in network tests (real package
      # installs, a real export of a real htmltools widget) need CRAN
      # reachable, which every runner has, but running them on all three
      # OSes would triple the network flakiness and runtime for no extra
      # coverage this suite doesn't already get elsewhere.
      EMBER_TEST_NETWORK: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          upload-snapshots: true

  grammar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grammar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grammar/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Generated parser is committed and current
        run: git diff --exit-code -- src/parser.js src/parser.terms.js dist
      - run: npm test

  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Only on ubuntu-latest, for the same reason as EMBER_TEST_NETWORK
      # above: the install tests are the only ones that exercise a real
      # package install (widget.R, EMBER_E2E_INSTALLS=1) end to end through
      # the browser, and running that on every OS would multiply the
      # install time and flakiness for no coverage this doesn't already
      # get from the R test suite's own opt-in network tests.
      EMBER_E2E_INSTALLS: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - run: R CMD INSTALL .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - working-directory: tests/e2e
        run: npm ci
      - working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - working-directory: tests/e2e
        run: npm test
      - name: Upload server logs and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: tests/e2e/test-results/
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            grammar/package-lock.json
            frontend-build/package-lock.json
      - name: Build the R grammar (frontend-build depends on it by path)
        working-directory: grammar
        run: |
          npm ci
          npm run build
      - name: Build the CodeMirror bundle, the vendor bundles, and copy assets
        working-directory: frontend-build
        run: |
          npm ci
          npm run build
      - name: Committed frontend files match a fresh rebuild
        run: |
          git diff --exit-code -- inst/frontend/imports inst/frontend/img/icons
          ! git status --porcelain -- inst/frontend/imports inst/frontend/img/icons | grep '^??'

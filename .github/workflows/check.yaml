name: check

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    # A PR that changes only docs/ runs nothing here: no job reads docs/ (the
    # package build ignores it). No check is required to merge today; if one
    # ever is, a docs-only PR would wait on it forever, so drop this then.
    paths-ignore:
      - 'docs/**'

# A new push to a pull request cancels that PR's older runs, which would only
# report on a head nobody will merge. Every other run (a push, a run by hand)
# gets a group of its own, so it is never cancelled and never waits: a shared
# group would also drop a run still waiting behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  probe476:
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - working-directory: tests/e2e
        run: npm ci
      - working-directory: tests/e2e
        run: npx playwright-core install chromium
      - name: "#529 and #476 under load: three files at once, 20 times, full output on failure"
        working-directory: tests/e2e
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 20); do
            echo "=== run $i"
            if [ "${{ matrix.shard }}" = 1 ]; then files="tests/editor-services.test.mjs tests/cells.test.mjs tests/ui-sweep.test.mjs"; else files="tests/cells.test.mjs tests/a11y.test.mjs tests/add-delete-reload.test.mjs"; fi
            if node run.mjs $files > out.txt 2>&1; then
              grep -E "DIAG476|^# (pass|fail)|warm-up" out.txt | cut -c1-8000
            else
              fails=$((fails + 1))
              echo "--- full output of run $i"
              cat out.txt
              for f in test-results/*.txt; do echo "== $f"; cat "$f"; done
              echo "--- end of run $i"
            fi
            rm -rf test-results
          done
          echo "runs with a failure: $fails of 20"

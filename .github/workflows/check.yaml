name: check

on:
  push:
    branches: ['ci/**']

jobs:
  # Throwaway probe for #536: the whole --as-cran check with NOT_CRAN unset,
  # timed, then the per-file test times and the sizes.
  probe536:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Machine
        shell: bash
        run: |
          Rscript -e 'cat(R.version.string, "\n"); cat("cores:", parallel::detectCores(), "\n")'
          env | grep -E '^(NOT_CRAN|EMBER_|GITHUB_PAT|_R_)' || true
      - name: R CMD build
        shell: bash
        run: |
          start=$(date +%s)
          R CMD build --no-manual .
          echo "build: $(( $(date +%s) - start )) s"
          ls -l ember_*.tar.gz
      - name: Installed size with and without kept source
        shell: bash
        run: |
          echo "R_KEEP_PKG_SOURCE=[${R_KEEP_PKG_SOURCE-unset}]"
          Rscript -e 'cat("keep.source.pkgs:", getOption("keep.source.pkgs"), "\n")'
          for keep in no yes; do
            rm -rf lib-$keep && mkdir lib-$keep
            R_KEEP_PKG_SOURCE=$keep R CMD INSTALL -l lib-$keep ember_*.tar.gz > install-$keep.log 2>&1 || tail -20 install-$keep.log
            echo "== keep source: $keep"
            du -sk lib-$keep/ember lib-$keep/ember/R lib-$keep/ember/frontend
            ls -l lib-$keep/ember/R
          done
      - name: "R CMD check --as-cran --no-tests, R_KEEP_PKG_SOURCE unset"
        shell: bash
        env:
          _R_CHECK_CRAN_INCOMING_: "false"
        run: |
          unset NOT_CRAN R_KEEP_PKG_SOURCE
          R CMD check --as-cran --no-manual --no-tests ember_*.tar.gz | grep -A4 "installed package size"

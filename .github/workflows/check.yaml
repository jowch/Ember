name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    name: R CMD check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          upload-snapshots: true

  grammar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grammar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grammar/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Generated parser is committed and current
        run: git diff --exit-code -- src/parser.js src/parser.terms.js dist
      - run: npm test

name: check

on:
  push:
    branches: ['ci/**']

jobs:
  # Throwaway probe for #536 on #547: the whole --as-cran check with NOT_CRAN unset,
  # timed, then the per-file test times and the sizes.
  probe536:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Machine
        shell: bash
        run: |
          Rscript -e 'cat(R.version.string, "\n"); cat("cores:", parallel::detectCores(), "\n")'
          env | grep -E '^(NOT_CRAN|EMBER_|GITHUB_PAT|_R_)' || true
      - name: R CMD build
        shell: bash
        run: |
          start=$(date +%s)
          R CMD build --no-manual .
          echo "build: $(( $(date +%s) - start )) s"
          ls -l ember_*.tar.gz
      - name: "R CMD check --as-cran, NOT_CRAN unset, timed"
        shell: bash
        env:
          _R_CHECK_CRAN_INCOMING_: "false"
          _R_CHECK_LIMIT_CORES_: "true"
        run: |
          unset NOT_CRAN GITHUB_PAT GITHUB_TOKEN EMBER_CHROMIUM
          for v in $(env | grep -o '^EMBER_TEST_[A-Z_]*'); do unset $v; done
          start=$(date +%s)
          set +e
          R CMD check --as-cran --no-manual ember_*.tar.gz
          code=$?
          echo "== check: $(( $(date +%s) - start )) s, exit $code"
          cat ember.Rcheck/00check.log
          tail -40 ember.Rcheck/tests/testthat.Rout* 2>/dev/null
          echo "== installed size by folder"
          du -sk ember.Rcheck/ember ember.Rcheck/ember/* ember.Rcheck/ember/libs/* 2>/dev/null | sort -n
          du -sk ember.Rcheck/ember/www/* ember.Rcheck/ember/frontend/* 2>/dev/null | sort -n | tail -20
          exit 0

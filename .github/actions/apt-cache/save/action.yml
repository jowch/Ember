name: Keep apt's downloads
description: >
  Saves the .deb files apt downloaded in this job for the next run, unless
  the restore action found an exact match. Does nothing off Linux.
inputs:
  key:
    description: The restore action's key output.
    required: true
  cache-hit:
    description: The restore action's cache-hit output.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Only what this runner's apt can still use: autoclean drops versions
    # its package lists no longer have.
    - if: runner.os == 'Linux' && inputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get autoclean -qq
        rm -rf ~/apt-archives && mkdir ~/apt-archives
        find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-archives {} +
        du -sh ~/apt-archives; ls ~/apt-archives | wc -l
    - if: runner.os == 'Linux' && inputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/apt-archives
        key: ${{ inputs.key }}
